name: orbit

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - '5432:5432'
    volumes:
      - orbit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - orbit-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: orbit
      MINIO_ROOT_PASSWORD: orbit-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - orbit-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
    command: ['pnpm', '--filter', '@orbit/db', 'migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
      ALLOW_DEVELOPMENT_SEED: 'true'
    command: ['pnpm', '--filter', '@orbit/db', 'seed']
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '4100:4100'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://orbit:orbit@postgres:5432/orbit?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      api:
        condition: service_healthy

volumes:
  orbit-postgres:
  orbit-redis:
  orbit-minio:
