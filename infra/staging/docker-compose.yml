name: orbit-staging

x-orbit-environment: &orbit-environment
  NODE_ENV: production
  LOG_LEVEL: info
  API_HOST: 0.0.0.0
  API_PORT: 4100
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must come from the secret manager}
  REDIS_URL: ${REDIS_URL:?REDIS_URL must come from the secret manager}
  PUBLIC_API_URL: https://${STAGING_DOMAIN:?STAGING_DOMAIN is required}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must come from the secret manager}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must come from the secret manager}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must come from the secret manager}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must come from the secret manager}
  EXPORT_SIGNING_SECRET: ${EXPORT_SIGNING_SECRET:?EXPORT_SIGNING_SECRET must come from the secret manager}
  OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-resend}
  ALLOW_DEVELOPMENT_OTP_DISPLAY: 'false'
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must come from the secret manager}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL must come from the secret manager}
  PHONE_OTP_PROVIDER: ${PHONE_OTP_PROVIDER:-twilio}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID must come from the secret manager}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN must come from the secret manager}
  TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:?TWILIO_FROM_PHONE must come from the secret manager}
  SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN must come from the secret manager}
  SENTRY_ENVIRONMENT: staging
  ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
  LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-stub}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  LLM_MODEL_INTERVIEW: ${LLM_MODEL_INTERVIEW:-stub-interview-v1}
  LLM_MODEL_CONVERSATION: ${LLM_MODEL_CONVERSATION:-stub-conversation-v1}
  LLM_MODEL_RERANK: ${LLM_MODEL_RERANK:-stub-rerank-v1}
  LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-stub-judge-v1}
  LLM_MODEL_DRAFT: ${LLM_MODEL_DRAFT:-stub-draft-v1}
  LLM_MODEL_REDACTION: ${LLM_MODEL_REDACTION:-stub-redaction-v1}
  LLM_MODEL_EMBEDDING: ${LLM_MODEL_EMBEDDING:-stub-embedding-v1}
  LLM_MODEL_SKILL_CRYSTALLIZATION: ${LLM_MODEL_SKILL_CRYSTALLIZATION:-stub-skill-crystallization-v1}
  LLM_MODEL_SKILL_VALIDATION: ${LLM_MODEL_SKILL_VALIDATION:-stub-skill-validation-v1}
  LLM_MODEL_ASK_ROUTING: ${LLM_MODEL_ASK_ROUTING:-stub-ask-routing-v1}
  LLM_CHEAP_FALLBACK_MODEL: ${LLM_CHEAP_FALLBACK_MODEL:-stub-fallback-v1}
  LLM_INPUT_COST_CENTS_PER_MILLION_TOKENS: ${LLM_INPUT_COST_CENTS_PER_MILLION_TOKENS:-20}
  LLM_OUTPUT_COST_CENTS_PER_MILLION_TOKENS: ${LLM_OUTPUT_COST_CENTS_PER_MILLION_TOKENS:-120}
  LLM_COST_INTERVIEW_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_INTERVIEW_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_INTERVIEW_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_INTERVIEW_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_CONVERSATION_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_CONVERSATION_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_CONVERSATION_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_CONVERSATION_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_RERANK_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_RERANK_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_RERANK_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_RERANK_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_JUDGE_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_JUDGE_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_JUDGE_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_JUDGE_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_DRAFT_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_DRAFT_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_DRAFT_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_DRAFT_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_REDACTION_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_REDACTION_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_REDACTION_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_REDACTION_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_EMBEDDING_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_EMBEDDING_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_EMBEDDING_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_EMBEDDING_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_SKILL_CRYSTALLIZATION_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_SKILL_CRYSTALLIZATION_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_SKILL_CRYSTALLIZATION_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_SKILL_CRYSTALLIZATION_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_SKILL_VALIDATION_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_SKILL_VALIDATION_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_SKILL_VALIDATION_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_SKILL_VALIDATION_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_ASK_ROUTING_INPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_ASK_ROUTING_INPUT_CENTS_PER_MILLION_TOKENS:-}
  LLM_COST_ASK_ROUTING_OUTPUT_CENTS_PER_MILLION_TOKENS: ${LLM_COST_ASK_ROUTING_OUTPUT_CENTS_PER_MILLION_TOKENS:-}
  USER_DAILY_COST_CAP_CENTS: ${USER_DAILY_COST_CAP_CENTS:-35}
  GLOBAL_DAILY_COST_CAP_CENTS: ${GLOBAL_DAILY_COST_CAP_CENTS:-2500}
  SEARCH_API_ENDPOINT: ${SEARCH_API_ENDPOINT:-https://api.search.brave.com/res/v1/web/search}
  SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  GMAIL_INTEGRATION_ENABLED: ${GMAIL_INTEGRATION_ENABLED:-false}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  ORBIT_MOBILE_REDIRECT_URL: ${ORBIT_MOBILE_REDIRECT_URL:-orbit://connections}

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.api
    environment: *orbit-environment
    command: ['pnpm', '--filter', '@orbit/db', 'migrate:deploy']

  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.api
    environment: *orbit-environment
    expose: ['4100']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4100/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile.worker
    environment: *orbit-environment
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN is required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - orbit-staging-caddy-data:/data
      - orbit-staging-caddy-config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  orbit-staging-caddy-data:
  orbit-staging-caddy-config:
